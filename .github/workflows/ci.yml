# Cross-platform build verification + installer artifacts.
#
# This is TypeAloud's "build farm": every push/PR compiles the app on macOS,
# Windows, and Linux and uploads the resulting installers as downloadable
# workflow artifacts. It lets a Mac-only developer get + smoke-test Windows and
# Linux builds without owning those machines. It does NOT publish GitHub
# Releases — release.yml does that for all three platforms on a v* tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            target: aarch64-apple-darwin
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: Linux
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Tauri 2 Linux build prerequisites. webkit2gtk-4.1 (NOT 4.0) is required
      # for Tauri 2; libayatana-appindicator backs the system tray. libxdo backs
      # enigo's default xdo insertion backend; libxkbcommon backs enigo's keymap
      # crate; libx11/libxtst back rdev's X11/XRecord global hotkey listener.
      # NOTE: stock WebKitGTK may lack getUserMedia/MediaStream — recording on
      # Linux is a separate, known blocker (see the cross-platform design in
      # docs/superpowers/specs/2026-07-01-cross-platform-support-design.md).
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxtst-dev \
            build-essential \
            curl wget file libssl-dev pkg-config

      - name: Install JS tooling (@tauri-apps/cli)
        run: npm ci

      # Run both test suites before the (expensive) bundle build: a red test
      # fails the leg fast and never uploads installers. This is also the only
      # automated check the Windows/Linux legs get — the cross-platform logic
      # tests (settings/history/hotkey parsing/scrub) run on real hosts here.
      # macOS-only tests (platform::macos) are cfg'd out on the other legs.
      # Globs are expanded by node's test runner itself (not the shell), so the
      # same line works on all three OS legs and every *.test.mjs in these dirs
      # — including future ones — joins CI automatically.
      - name: Run Node tests
        run: npm test

      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri

      - name: Build (bundles for this host)
        run: npm run tauri -- build --target ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: typealoud-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
