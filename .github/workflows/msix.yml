# Builds the Microsoft Store (MSIX) package and uploads it as a workflow
# artifact, to be submitted by hand in Partner Center (RELEASING.md, "Microsoft
# Store"). Manual on purpose: a Store submission is a separate decision from a
# GitHub release, and this must never hold up release.yml's publish job.
#
# Identity comes from the repository variables MSIX_IDENTITY_NAME,
# MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME. Without them the package gets
# a placeholder identity that the Store won't accept.
name: Microsoft Store package

on:
  workflow_dispatch:

jobs:
  msix:
    name: MSIX (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install JS tooling (@tauri-apps/cli)
        run: npm ci

      - name: Build the app
        env:
          # Same identity as the release build: clean version badge, usage
          # statistics enabled (build.rs, usage.rs).
          TYPEALOUD_OFFICIAL_BUILD: "1"
          TYPEALOUD_POSTHOG_KEY: ${{ secrets.SAYTYPE_POSTHOG_KEY }}
        run: npx tauri build --target x86_64-pc-windows-msvc --no-bundle

      - name: Pack the MSIX
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: node scripts/build-msix.mjs

      # Registers the unpacked layout the way a developer machine would. It
      # proves Windows accepts the manifest (StartupTask and resources.pri
      # included), that the running app sees its package identity (the
      # "updater:store-managed" log line), which is what turns the self-updater
      # off, and that it finds the manifest's startup task ("autostart:startup-task
      # state=disabled", the state a fresh install starts in). Reaching those
      # lines also means the WebView2 check at startup let the app through.
      - name: Register and launch the package
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1
          Add-AppxPackage -Register src-tauri\target\msix\layout\AppxManifest.xml
          [xml]$manifest = Get-Content src-tauri\target\msix\layout\AppxManifest.xml
          $package = Get-AppxPackage -Name $manifest.Package.Identity.Name
          if (-not $package) { throw "The package did not register." }
          $package | Format-List Name, Version, PackageFamilyName, InstallLocation
          Start-Process "shell:AppsFolder\$($package.PackageFamilyName)!TypeAloud"
          $packageData = Join-Path $env:LOCALAPPDATA "Packages\$($package.PackageFamilyName)"
          if (-not (Test-Path (Join-Path $package.InstallLocation "resources.pri"))) {
            throw "The package has no resources.pri."
          }
          $expected = @("updater:store-managed", "autostart:startup-task state=disabled")
          $missing = $expected
          foreach ($attempt in 1..30) {
            Start-Sleep -Seconds 2
            $logs = Get-ChildItem $packageData -Recurse -Filter *.log -ErrorAction SilentlyContinue
            $missing = @($expected | Where-Object { -not ($logs | Select-String -SimpleMatch -Pattern $_ -Quiet) })
            if ($missing.Count -eq 0) { break }
          }
          Get-Process TypeAloud -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($missing.Count -gt 0) {
            Get-ChildItem $packageData -Recurse -ErrorAction SilentlyContinue | Select-Object -First 50 FullName
            $logs | Get-Content -Tail 40 -ErrorAction SilentlyContinue
            throw "The packaged app never logged: $($missing -join ', ')"
          }
          Write-Host "The packaged app detected its package identity and its startup task."

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: msix
          path: dist/*.msix
          if-no-files-found: error
