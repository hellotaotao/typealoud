[package]
name = "typealoud"
version = "1.19.3"
description = "Voice input method software"
authors = ["Tao"]
license = "GPL-3.0-only"
repository = "https://github.com/hellotaotao/typealoud"
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "typealoud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
iana-time-zone = "0.1"
dirs = "6.0"
futures-util = "0.3"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rdev = "0.5"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
# CPU and memory share the system feature; omit disks, networks, users and Rayon.
sysinfo = { version = "0.33.1", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc = "0.2"
# Liquid Glass backdrops (glass.rs). Same versions tauri's window-vibrancy already pulls in.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSAppearance", "NSApplication", "NSGlassEffectView", "NSGraphics", "NSResponder", "NSView", "NSWindow"] }
# Native audio capture. WKWebView's getUserMedia attenuates the first 3.0 s of
# every fresh stream by ~32 dB; CoreAudio does not. Measured side by side on the
# same device — see docs/audio-capture.md.
cpal = "0.15"

[target.'cfg(not(target_os = "macos"))'.dependencies]
enigo = "0.3.0"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.6.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
